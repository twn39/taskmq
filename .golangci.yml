# golangci-lint v2 — GitHub Actions + local `golangci-lint run`.
#
# Install with the same Go toolchain as go.mod (required for go 1.25+):
#   go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.4.0
#
# CI gate uses a focused linter set. Re-enable revive/gosec gradually as
# exported docs and security findings are cleaned up.
version: 2

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  # Production packages only; tests are enforced by `go test`.
  tests: false

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    paths:
      - third_party
    rules:
      # CLI table printers — discarding write errors is intentional.
      - path: cmd/taskmq-cli/
        text: "Error return value of `fmt\\.(Fprint|Fprintf|Fprintln)"
        linters: [errcheck]
      # PubSub reconnect closes are best-effort.
      - text: "Error return value of `.*\\.Close`"
        linters: [errcheck]
      # go-redis API migrations tracked separately; not a CI gate yet.
      - text: "SA1019:"
        linters: [staticcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
