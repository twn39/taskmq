# Server configuration
server:
  port: ":8080"
  grpc_port: ":50051"

# Logger configuration
logger:
  level: "info"

# Redis configuration
# mode: standalone (default) | cluster | sentinel
# cluster/sentinel: set addrs (seed nodes / sentinels); sentinel also needs master_name
redis:
  mode: standalone
  addr: "localhost:6379"
  # addrs: ["127.0.0.1:7000", "127.0.0.1:7001"]
  # master_name: "mymaster"
  pool_size: 0 # Maximum number of socket connections (0 resolved dynamically)

# TaskMQ configuration
taskmq:
  codec: "binary"
  default_unique_ttl: 1h
  cron_healing_interval: 1m
  cron_healing_lock_ttl: 50s
  cron_healing_scan_batch_size: 100
  cron_healing_scan_max_count: 1000
  scheduler_poll_interval: 500ms
  janitor_interval: 3s
  janitor_min_idle_time: 5s
  # How long workers wait for in-flight tasks on graceful stop (default 30s).
  shutdown_timeout: 30s
  # Optional completed task meta/result retention (0 = delete meta on success; Asynq-like when set).
  # completed_retention: 24h
  # completed_max_count: 10000
  # Approximate MAXLEN for per-queue lifecycle events stream (0 = default 10000).
  # events_max_len: 10000
  # Memory / storage lifecycle (defaults are production-safe and backward compatible).
  # Hard limits default to 0 (disabled). Enable in prod when needed.
  lifecycle:
    # stream_maxlen: 0                 # optional catastrophe valve (prefer hard limit + safe trim)
    # enqueue_soft_limit: 0
    # enqueue_hard_limit: 0            # reject Enqueue when XLEN >= limit
    # delayed_max_count: 0
    # delayed_max_delay: 0
    delayed_overflow: reject           # reject | drop_farthest
    dlq_max_count: 1000                # 0 = unlimited
    # dlq_max_age: 168h
    cancelled_ttl: 24h
    # max_payload_bytes: 0
    safe_trim_enabled: true
    safe_trim_interval: 30s
    safe_trim_batch_limit: 1000
    purge_cancelled_delayed: true
    # idle_consumer_timeout: 0         # e.g. 1h to prune idle group consumers
  queues:
    - name: "default"
      concurrency: 5
