syntax = "proto3";

package taskmq.v1;

option go_package = "github.com/twn39/taskmq/api/proto/taskmq/v1;taskmqv1";

// TaskMQService provides APIs for multi-language enqueuing and queue management.
service TaskMQService {
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  rpc EnqueueIn(EnqueueInRequest) returns (EnqueueResponse);
  rpc EnqueueAt(EnqueueAtRequest) returns (EnqueueResponse);
  rpc RegisterCron(RegisterCronRequest) returns (RegisterCronResponse);

  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  rpc DeleteDeadLetter(DeleteDeadLetterRequest) returns (DeleteDeadLetterResponse);
  rpc RetryDeadLetter(RetryDeadLetterRequest) returns (RetryDeadLetterResponse);
}

message Task {
  string id = 1;
  string queue = 2;
  string name = 3;
  bytes payload = 4;
  int32 max_retry = 5;
  int64 timeout_ms = 6;
  string unique_key = 7;
  int64 unique_ttl_ms = 8;
  string cron_spec = 9;
}

message EnqueueRequest {
  Task task = 1;
}

message EnqueueResponse {
  string task_id = 1;
}

message EnqueueInRequest {
  Task task = 1;
  int64 delay_ms = 2;
}

message EnqueueAtRequest {
  Task task = 1;
  int64 timestamp_ms = 2;
}

message RegisterCronRequest {
  string job_name = 1;
  string cron_spec = 2;
  Task task = 3;
}

message RegisterCronResponse {
  bool success = 1;
}

message ListDeadLettersRequest {
  string queue = 1;
  int32 limit = 2;
}

message ListDeadLettersResponse {
  repeated Task tasks = 1;
}

message DeleteDeadLetterRequest {
  string queue = 1;
  string task_id = 2;
}

message DeleteDeadLetterResponse {
  bool success = 1;
}

message RetryDeadLetterRequest {
  string queue = 1;
  string task_id = 2;
}

message RetryDeadLetterResponse {
  bool success = 1;
}
